<!-- ================= APPLICATION ENGINE SCRIPT (AUTO-SYNC ENABLED) ================= -->
    <script>
        // ================= CONFIGURATION =================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxip1ha_ESMt3plLxHR8TWnt3RafngNlzoZQcl-ZgbjieapIUKy36MB3UMm-XB-gdDE/exec"; 
        const COACHING_UPI_ID = "shikshajhs@ptyes";

        const STATE = {
            adminUser: JSON.parse(localStorage.getItem('shiksha_admin_user') || JSON.stringify({
                phone: '9876543210',
                password: 'admin123'
            })),
            registeredTeachers: JSON.parse(localStorage.getItem('shiksha_teachers') || '[]'),
            currentRole: null,
            currentUserPhone: null,
            activePortalTab: 'home',
            selectedBoard: 'All',
            selectedAttClass: '10th',
            students: JSON.parse(localStorage.getItem('shiksha_students') || '[]'),
            holidays: JSON.parse(localStorage.getItem('shiksha_holidays') || '[]'),
            attendanceLogs: JSON.parse(localStorage.getItem('shiksha_att_logs') || '{}'),
            galleryItems: JSON.parse(localStorage.getItem('shiksha_gallery') || JSON.stringify([
                { id: 1, type: 'image', title: 'Smart Classroom & Digital IFP Panel', category: 'Classroom', src: 'https://images.unsplash.com/photo-1580582932707-520aed937b7b?w=800&auto=format&fit=crop&q=60' },
                { id: 2, type: 'image', title: 'Interactive Science Concept Session', category: 'Classroom', src: 'https://images.unsplash.com/photo-1509062522246-3755977927d7?w=800&auto=format&fit=crop&q=60' },
                { id: 3, type: 'image', title: 'Weekly Assessment & Test Paper Drive', category: 'Events', src: 'https://images.unsplash.com/photo-1427504494785-3a9ca7044f45?w=800&auto=format&fit=crop&q=60' }
            ])),
            currentGalleryFilter: 'All',
            notices: JSON.parse(localStorage.getItem('shiksha_notices') || JSON.stringify([
                { id: 1, title: 'Admissions Open 2026-27', desc: 'New batches for Classes 6th to 10th (CBSE / ICSE / UP Board) starting soon.', date: 'Nov 2026', tag: 'Important' },
                { id: 2, title: 'Interactive Flat Panel Smart Board', desc: 'Visual concepts in Science & Maths now delivered on smart boards.', date: 'Recent', tag: 'Academic' }
            ])),
            results: JSON.parse(localStorage.getItem('shiksha_results') || JSON.stringify([
                { id: 1, title: 'Unit Assessment', class: '10th', subject: 'Science', maxMarks: 50, date: 'Recent', topStudent: 'Published' }
            ])),
            loginRoleSelect: 'admin'
        };

        const cleanPhone = (val) => String(val || '').replace(/\D/g, '').slice(-10);

        window.addEventListener('DOMContentLoaded', () => {
            const savedSession = sessionStorage.getItem('shiksha_auth_role');
            const savedPhone = sessionStorage.getItem('shiksha_auth_phone');
            if (savedSession) {
                authorizeRole(savedSession, savedPhone);
            }
            renderPublicOverview();
            renderPublicTeachers();
            renderPublicNotices();
            renderGallery();
            renderTeachers();
            renderStudents();
            renderAttendanceList();
            renderFees();
            renderResults();
            updateKpis();
            
            const dateEl = document.getElementById('att-date-display');
            if (dateEl) dateEl.innerText = new Date().toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' });
            
            // क्लाउड डेटाबेस तुरंत फेच करें
            fetchCloudDatabase();
        });

        // ================= NAVIGATION SWITCHERS =================
        function showPublicSection(sectionId) {
            document.getElementById('view-public').classList.remove('hidden');
            document.getElementById('view-portal').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openPortalView() {
            if (!STATE.currentRole) {
                openLoginGateway();
                return;
            }
            document.getElementById('view-public').classList.add('hidden');
            document.getElementById('view-portal').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function switchPortalTab(tab) {
            STATE.activePortalTab = tab;
            
            ['home', 'students', 'attendance', 'fees'].forEach(t => {
                const page = document.getElementById(`portal-tab-${t}`);
                if (page) page.classList.add('hidden');
                
                const mobBtn = document.getElementById(`nav-portal-${t}`);
                if (mobBtn) mobBtn.className = "flex flex-col items-center justify-center text-slate-400 text-[10px] font-bold hover:text-indigo-600";
                
                const sideBtn = document.getElementById(`side-portal-${t}`);
                if (sideBtn) sideBtn.className = "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-900 transition";
            });

            const activePage = document.getElementById(`portal-tab-${tab}`);
            if (activePage) activePage.classList.remove('hidden');

            const activeMobBtn = document.getElementById(`nav-portal-${tab}`);
            if (activeMobBtn) activeMobBtn.className = "flex flex-col items-center justify-center text-indigo-600 text-[10px] font-bold";

            const activeSideBtn = document.getElementById(`side-portal-${tab}`);
            if (activeSideBtn) activeSideBtn.className = "w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl bg-indigo-600 text-white shadow-sm transition";
        }

        // ================= CLOUD SYNC ENGINE (REAL-TIME SYNC) =================
        async function fetchCloudDatabase() {
            if (!SCRIPT_URL) return;
            const statusEl = document.getElementById('cloud-sync-status');
            const sideStatusEl = document.getElementById('cloud-sync-status-side');
            if (statusEl) statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-indigo-400"></i> Syncing...';
            if (sideStatusEl) sideStatusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-[8px]"></i> Syncing...';

            try {
                // Cache-Busting (_t) पैरामीटर जिससे ब्राउज़र कभी पुराना डेटा न दिखाए
                const freshUrl = `${SCRIPT_URL}${SCRIPT_URL.includes('?') ? '&' : '?'}action=getAllData&_t=${Date.now()}`;
                const response = await fetch(freshUrl);
                const data = await response.json();

                if (data && (data.status === 'success' || data.students || data.teachers)) {
                    if (Array.isArray(data.students)) {
                        STATE.students = data.students;
                        localStorage.setItem('shiksha_students', JSON.stringify(STATE.students));
                    }
                    if (Array.isArray(data.teachers)) {
                        STATE.registeredTeachers = data.teachers;
                        localStorage.setItem('shiksha_teachers', JSON.stringify(STATE.registeredTeachers));
                    }
                    if (data.adminUser && data.adminUser.phone) {
                        STATE.adminUser = data.adminUser;
                        localStorage.setItem('shiksha_admin_user', JSON.stringify(STATE.adminUser));
                    }
                    if (Array.isArray(data.notices)) {
                        STATE.notices = data.notices;
                        localStorage.setItem('shiksha_notices', JSON.stringify(STATE.notices));
                    }
                    if (Array.isArray(data.holidays)) {
                        STATE.holidays = data.holidays;
                        localStorage.setItem('shiksha_holidays', JSON.stringify(STATE.holidays));
                    }

                    if (statusEl) {
                        statusEl.className = "text-[9px] font-semibold text-emerald-400 flex items-center gap-1";
                        statusEl.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-400"></i> Synced';
                    }
                    if (sideStatusEl) {
                        sideStatusEl.className = "text-[9px] font-semibold text-emerald-400 flex items-center gap-1 bg-emerald-950/60 px-2 py-0.5 rounded-full border border-emerald-800";
                        sideStatusEl.innerHTML = '<i class="fa-solid fa-circle-check text-[8px]"></i> Synced';
                    }

                    renderPublicOverview();
                    renderPublicTeachers();
                    renderPublicNotices();
                    renderStudents();
                    renderTeachers();
                    renderFees();
                    renderAttendanceList();
                    updateKpis();
                }
            } catch (err) {
                console.warn("Cloud offline or using local fallback.", err);
                if (statusEl) statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-amber-400"></i> Offline';
                if (sideStatusEl) sideStatusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-[8px] text-amber-400"></i> Local';
            }
        }

        async function postToCloud(payload) {
            if (!SCRIPT_URL) return;
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                console.error("Cloud push failed:", e);
            }
        }

        // ================= PUBLIC SITE RENDERING =================
        function renderPublicOverview() {
            const stuEl = document.getElementById('pub-stat-students');
            const teaEl = document.getElementById('pub-stat-teachers');
            if (stuEl) stuEl.innerText = STATE.students.length;
            if (teaEl) teaEl.innerText = STATE.registeredTeachers.length;
        }

        function renderPublicTeachers() {
            const container = document.getElementById('pub-teachers-grid');
            if (!container) return;
            container.innerHTML = '';

            if (STATE.registeredTeachers.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-6 text-slate-500 text-xs">Faculty directory updating.</div>`;
                return;
            }

            STATE.registeredTeachers.forEach(t => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center space-x-3.5 shadow-sm";
                card.innerHTML = `
                    ${t.photo ? 
                        `<img src="${t.photo}" class="w-12 h-12 rounded-xl object-cover border border-slate-700" alt="${t.name}">` : 
                        `<div class="w-12 h-12 rounded-xl bg-indigo-950 text-indigo-400 flex items-center justify-center font-bold text-base border border-indigo-800">${t.name ? t.name.charAt(0) : 'T'}</div>`
                    }
                    <div>
                        <h4 class="text-sm font-bold text-white">${t.name}</h4>
                        <p class="text-xs text-indigo-400 font-medium">${t.dept}</p>
                        <p class="text-[10px] text-slate-400 mt-0.5">${t.qualification || 'Senior Faculty'}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderPublicNotices() {
            const container = document.getElementById('pub-notices-container');
            if (!container) return;
            container.innerHTML = STATE.notices.map(n => `
                <div class="p-3 bg-slate-900 border border-slate-800 rounded-xl">
                    <div class="flex justify-between items-center text-[10px]">
                        <span class="px-2 py-0.5 rounded bg-indigo-950 text-indigo-300 font-bold border border-indigo-800">${n.tag}</span>
                        <span class="text-slate-400 font-medium">${n.date}</span>
                    </div>
                    <h4 class="text-xs font-bold text-white mt-1.5">${n.title}</h4>
                    <p class="text-[11px] text-slate-300 mt-1 leading-relaxed">${n.desc}</p>
                </div>
            `).join('');
        }

        // ================= GALLERY ENGINE =================
        function openAddGalleryModal() {
            if (STATE.currentRole !== 'admin') {
                alert("Only Admin can add media to the gallery.");
                return;
            }
            document.getElementById('inp-media-title').value = '';
            document.getElementById('inp-media-url').value = '';
            document.getElementById('inp-media-file').value = '';
            document.getElementById('modal-add-gallery').classList.remove('hidden');
        }

        async function handleSaveGalleryMedia(e) {
            e.preventDefault();
            const title = document.getElementById('inp-media-title').value.trim();
            const category = document.getElementById('inp-media-category').value;
            const mediaType = document.getElementById('inp-media-type').value;
            const fileInput = document.getElementById('inp-media-file');
            const urlInput = document.getElementById('inp-media-url').value.trim();

            const submitBtn = document.getElementById('btn-submit-media');
            const origText = submitBtn.innerHTML;

            const saveItem = (mediaSource) => {
                const newItem = {
                    id: Date.now(),
                    type: mediaType,
                    title: title,
                    category: category,
                    src: mediaSource
                };
                STATE.galleryItems.unshift(newItem);
                try {
                    localStorage.setItem('shiksha_gallery', JSON.stringify(STATE.galleryItems));
                } catch (err) {
                    alert("Storage limit reached! Please use an image/video URL instead of a large local file.");
                    submitBtn.innerHTML = origText;
                    return;
                }
                closeModal('modal-add-gallery');
                renderGallery();
                submitBtn.innerHTML = origText;
                alert("Media successfully added to gallery!");
            };

            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Processing file...';

                const reader = new FileReader();
                reader.onload = function(evt) {
                    saveItem(evt.target.result);
                };
                reader.onerror = function() {
                    alert("Failed to read file from storage.");
                    submitBtn.innerHTML = origText;
                };
                reader.readAsDataURL(file);
            } else if (urlInput) {
                saveItem(urlInput);
            } else {
                alert("Please select a file from your device or provide a media URL.");
            }
        }

        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            if (!grid) return;
            grid.innerHTML = '';

            const filtered = STATE.galleryItems.filter(item => {
                return STATE.currentGalleryFilter === 'All' || item.category === STATE.currentGalleryFilter;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-xs text-slate-500 py-6">No gallery media in this category.</div>';
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "group relative overflow-hidden rounded-2xl bg-slate-950 border border-slate-800 shadow-md cursor-pointer";
                card.onclick = () => openLightbox(item.type, item.src, item.title);

                card.innerHTML = `
                    <div class="h-48 w-full overflow-hidden bg-slate-900 relative">
                        ${item.type === 'video' ? `
                            <video src="${item.src}" class="w-full h-full object-cover pointer-events-none" preload="metadata"></video>
                            <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
                                <span class="w-10 h-10 rounded-full bg-indigo-600/90 text-white flex items-center justify-center shadow-lg group-hover:scale-110 transition">
                                    <i class="fa-solid fa-play text-sm ml-0.5"></i>
                                </span>
                            </div>
                        ` : `
                            <img src="${item.src}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        `}
                    </div>
                    <div class="p-3 bg-slate-900 border-t border-slate-800 flex items-center justify-between">
                        <div>
                            <h4 class="text-xs font-bold text-white group-hover:text-indigo-400 transition">${item.title}</h4>
                            <span class="text-[9px] uppercase font-bold text-slate-400">${item.category} &bull; ${item.type.toUpperCase()}</span>
                        </div>
                        ${STATE.currentRole === 'admin' ? `
                            <button onclick="event.stopPropagation(); deleteGalleryItem(${item.id})" class="text-rose-500 hover:text-rose-400 p-1 text-xs" title="Delete">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        ` : `
                            <i class="fa-solid fa-expand text-xs text-slate-500 group-hover:text-white transition"></i>
                        `}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function deleteGalleryItem(id) {
            if (STATE.currentRole !== 'admin') return;
            if (confirm("Remove this item from the gallery?")) {
                STATE.galleryItems = STATE.galleryItems.filter(item => item.id !== id);
                localStorage.setItem('shiksha_gallery', JSON.stringify(STATE.galleryItems));
                renderGallery();
            }
        }

        function openLightbox(type, src, caption) {
            const imgEl = document.getElementById('lightbox-img');
            const vidEl = document.getElementById('lightbox-video');
            const capEl = document.getElementById('lightbox-caption');

            capEl.innerText = caption;

            if (type === 'video') {
                imgEl.classList.add('hidden');
                vidEl.classList.remove('hidden');
                vidEl.src = src;
                vidEl.play();
            } else {
                vidEl.classList.add('hidden');
                vidEl.pause();
                imgEl.classList.remove('hidden');
                imgEl.src = src;
            }

            document.getElementById('modal-lightbox').classList.remove('hidden');
        }

        function closeLightbox() {
            const vidEl = document.getElementById('lightbox-video');
            vidEl.pause();
            vidEl.src = '';
            document.getElementById('modal-lightbox').classList.add('hidden');
        }

        function filterGallery(category) {
            STATE.currentGalleryFilter = category;
            document.querySelectorAll('.gal-btn').forEach(btn => {
                btn.className = btn.innerText.includes(category) 
                    ? "gal-btn active px-3 py-1 rounded-full bg-indigo-600 text-white font-semibold"
                    : "gal-btn px-3 py-1 rounded-full bg-slate-800 text-slate-300 hover:text-white font-semibold";
            });
            renderGallery();
        }

        // ================= UPI PAYMENT & QR =================
        function initiateDirectUpiPay(studentName, amount) {
            const numAmount = parseFloat(amount) || 0;
            if (numAmount <= 0) {
                alert("No pending fees due.");
                return;
            }
            const note = `SHIKSHA Coaching Fee - ${studentName}`;
            const upiUrl = `upi://pay?pa=${COACHING_UPI_ID}&pn=SHIKSHA%20Coaching%20Institute&am=${numAmount}&cu=INR&tn=${encodeURIComponent(note)}`;
            window.location.href = upiUrl;
        }

        function openUpiQrModal() {
            document.getElementById('modal-upi-qr').classList.remove('hidden');
        }

        function copyUpiId() {
            navigator.clipboard.writeText(COACHING_UPI_ID);
            alert("UPI ID copied: " + COACHING_UPI_ID);
        }

        function sendWhatsAppFeeReceipt(studentId) {
            const student = STATE.students.find(s => s.id === studentId);
            if (!student) return;

            const cleanNumber = cleanPhone(student.phone);
            const dateStr = new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
            const pendingAmount = student.feePending || 0;

            const textMessage = 
`*SHIKSHA COACHING INSTITUTE*
_Fee Notification & Receipt Slip_
--------------------------------
*Date:* ${dateStr}
*Student Name:* ${student.name}
*Class & Board:* ${student.class} (${student.board})
*Pending Balance:* ₹${pendingAmount}
--------------------------------
*Pay via UPI:* ${COACHING_UPI_ID}
_Contact coaching admin for payment verification._
*Location:* Panchwati, Jhansi (U.P.)`;

            const whatsappUrl = `https://wa.me/91${cleanNumber}?text=${encodeURIComponent(textMessage)}`;
            window.open(whatsappUrl, '_blank');
        }

        // ================= AUTHENTICATION GATEWAY =================
        function openLoginGateway() {
            document.getElementById('modal-login-gateway').classList.remove('hidden');
        }

        function setLoginRole(role) {
            STATE.loginRoleSelect = role;
            const btnAdmin = document.getElementById('role-btn-admin');
            const btnTeacher = document.getElementById('role-btn-teacher');
            const btnParent = document.getElementById('role-btn-parent');
            hideAuthError();

            [btnAdmin, btnTeacher, btnParent].forEach(btn => btn.className = "py-2 rounded-lg text-slate-400 transition");

            if (role === 'admin') {
                btnAdmin.className = "py-2 rounded-lg bg-indigo-600 text-white font-bold transition";
                document.getElementById('login-phone-label').innerText = "Registered Admin Mobile";
            } else if (role === 'teacher') {
                btnTeacher.className = "py-2 rounded-lg bg-indigo-600 text-white font-bold transition";
                document.getElementById('login-phone-label').innerText = "Registered Teacher Mobile";
            } else {
                btnParent.className = "py-2 rounded-lg bg-indigo-600 text-white font-bold transition";
                document.getElementById('login-phone-label').innerText = "Registered Student / Parent Mobile";
            }
        }

        async function handleSecureLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('login-mobile').value.trim();
            const password = document.getElementById('login-password').value.trim();
            hideAuthError();

            if (phone.length !== 10) {
                showAuthError("Please enter a valid 10-digit mobile number.");
                return;
            }

            const btn = document.getElementById('btn-login-submit');
            const orig = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Verifying...';

            // लॉगिन से पहले हमेशा क्लाउड से ताज़ा डेटा सिंक करें
            await fetchCloudDatabase();
            btn.innerHTML = orig;

            const targetRole = STATE.loginRoleSelect;

            if (targetRole === 'admin') {
                if (cleanPhone(phone) !== cleanPhone(STATE.adminUser.phone)) {
                    showAuthError("Invalid Mobile Number! Not registered as Admin.");
                    return;
                }
                if (password !== STATE.adminUser.password) {
                    showAuthError("Incorrect Password! Access denied.");
                    return;
                }
                authorizeRole('admin');
                closeModal('modal-login-gateway');
                openPortalView();
                return;
            }

            if (targetRole === 'teacher') {
                const teacher = STATE.registeredTeachers.find(t => cleanPhone(t.phone) === cleanPhone(phone));
                if (!teacher) {
                    showAuthError("Invalid Mobile Number! No faculty record registered.");
                    return;
                }
                if (String(teacher.password).trim() !== password) {
                    showAuthError("Incorrect Password! Access denied.");
                    return;
                }
                authorizeRole('teacher', phone);
                closeModal('modal-login-gateway');
                openPortalView();
                return;
            }

            if (targetRole === 'parent') {
                const student = STATE.students.find(s => cleanPhone(s.phone) === cleanPhone(phone));
                if (!student) {
                    showAuthError("Invalid Mobile Number! Not registered with any student.");
                    return;
                }
                if (String(student.password).trim() !== password) {
                    showAuthError("Incorrect Password! Access denied.");
                    return;
                }
                authorizeRole('parent', phone);
                closeModal('modal-login-gateway');
                openPortalView();
                return;
            }
        }

        function showAuthError(msg) {
            const errBox = document.getElementById('auth-error-box');
            document.getElementById('auth-error-msg').innerText = msg;
            errBox.classList.remove('hidden');
        }

        function hideAuthError() {
            document.getElementById('auth-error-box').classList.add('hidden');
        }

        function togglePasswordVisibility() {
            const inp = document.getElementById('login-password');
            const ico = document.getElementById('pwd-eye-icon');
            if (inp.type === 'password') {
                inp.type = 'text';
                ico.className = 'fa-solid fa-eye-slash text-xs';
            } else {
                inp.type = 'password';
                ico.className = 'fa-solid fa-eye text-xs';
            }
        }

        function authorizeRole(role, phone = null) {
            STATE.currentRole = role;
            STATE.currentUserPhone = phone;
            sessionStorage.setItem('shiksha_auth_role', role);
            if (phone) sessionStorage.setItem('shiksha_auth_phone', phone);

            document.getElementById('btn-header-login').classList.add('hidden');
            document.getElementById('portal-user-badge').classList.remove('hidden');
            document.getElementById('portal-user-badge').classList.add('flex');
            
            const pill = document.getElementById('header-role-pill');
            const portalPill = document.getElementById('portal-role-pill');
            const portalPillSide = document.getElementById('portal-role-pill-side');
            const roleName = role === 'admin' ? 'Admin' : (role === 'teacher' ? 'Faculty' : 'Student');
            if (pill) pill.innerText = roleName;
            if (portalPill) portalPill.innerText = roleName;
            if (portalPillSide) portalPillSide.innerText = roleName;

            const btnAddStu = document.getElementById('btn-add-student-top');
            const btnAddTea = document.getElementById('btn-add-teacher-top');
            const btnSaveAtt = document.getElementById('btn-save-attendance');
            const pinBtn = document.getElementById('admin-pin-change-btn');
            const kpiBox = document.getElementById('admin-kpis');
            const teacherCard = document.getElementById('admin-teachers-card');
            const btnAddResult = document.getElementById('btn-add-result');
            const btnAddGallery = document.getElementById('btn-add-gallery-admin');

            if (role === 'admin') {
                if (btnAddStu) btnAddStu.classList.remove('hidden');
                if (btnAddTea) btnAddTea.classList.remove('hidden');
                if (btnSaveAtt) btnSaveAtt.classList.remove('hidden');
                if (pinBtn) pinBtn.classList.remove('hidden');
                if (kpiBox) kpiBox.classList.remove('hidden');
                if (teacherCard) teacherCard.classList.remove('hidden');
                if (btnAddResult) btnAddResult.classList.remove('hidden');
                if (btnAddGallery) btnAddGallery.classList.remove('hidden');

        function calculateDynamicAttendance(studentId) {
            const today = new Date();
            const currentDayNumber = today.getDate();
            const currentYearMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;

            const monthHolidays = STATE.holidays.filter(h => {
                return h.date.startsWith(currentYearMonth) && parseInt(h.date.split('-')[2], 10) <= currentDayNumber;
            }).length;

            const workingDays = Math.max(1, currentDayNumber - monthHolidays);
            const studentHistory = STATE.attendanceLogs[studentId] || { present: workingDays, leave: 0, absent: 0 };
            
            const present = Math.min(studentHistory.present, workingDays);
            const leave = studentHistory.leave || 0;
            const absent = Math.max(0, workingDays - present - leave);
            const percentage = Math.round((present / workingDays) * 100);

            return { workingDays, holidays: monthHolidays, present, leave, absent, percentage };
        }

        function markAtt(id, status, btn) {
            if (STATE.currentRole === 'parent') return;
            const parent = btn.parentElement;
            parent.querySelectorAll('.att-btn').forEach(b => b.className = "att-btn w-7 h-7 rounded-lg text-xs font-bold bg-slate-100 text-slate-500");
            
            const alertBtn = document.getElementById(`absent-alert-${id}`);

            if (!STATE.attendanceLogs[id]) {
                const stats = calculateDynamicAttendance(id);
                STATE.attendanceLogs[id] = { present: stats.present, leave: stats.leave, absent: stats.absent };
            }

            if (status === 'P') {
                btn.className = "att-btn w-7 h-7 rounded-lg text-xs font-bold bg-emerald-600 text-white";
                if (alertBtn) alertBtn.classList.add('hidden');
            }
            if (status === 'A') {
                btn.className = "att-btn w-7 h-7 rounded-lg text-xs font-bold bg-rose-600 text-white";
                if (alertBtn) alertBtn.classList.remove('hidden');
                if (STATE.attendanceLogs[id].present > 0) {
                    STATE.attendanceLogs[id].present--;
                    STATE.attendanceLogs[id].absent++;
                }
            }
            if (status === 'L') {
                btn.className = "att-btn w-7 h-7 rounded-lg text-xs font-bold bg-amber-500 text-white";
                if (alertBtn) alertBtn.classList.add('hidden');
                if (STATE.attendanceLogs[id].present > 0) {
                    STATE.attendanceLogs[id].present--;
                    STATE.attendanceLogs[id].leave++;
                }
            }

            localStorage.setItem('shiksha_att_logs', JSON.stringify(STATE.attendanceLogs));
            updateAttendanceAnalyticsCard(id);
        }

            if (!container) return;
            container.innerHTML = STATE.results.map(r => `
                <div class="p-3 bg-amber-50/60 rounded-xl border border-amber-200/60 flex items-center justify-between">
                    <div>
                        <span class="text-[9px] font-bold px-1.5 py-0.5 bg-amber-200 text-amber-800 rounded">Class ${r.class}</span>
                        <h4 class="text-xs font-bold text-slate-800 mt-0.5">${r.title}</h4>
                        <p class="text-[10px] text-slate-500">Max Marks: ${r.maxMarks}</p>
                    </div>
                    <span class="text-xs font-bold text-amber-600">${r.topStudent}</span>
                </div>
            `).join('');
        }

        function updateKpis() {
            document.getElementById('kpi-total-students').innerText = STATE.students.length;
            const totalDue = STATE.students.reduce((acc, s) => acc + (parseFloat(s.feePending) || 0), 0);
            document.getElementById('kpi-due-fees').innerText = '₹' + totalDue;
            document.getElementById('fee-total-due-large').innerText = '₹' + totalDue;
            document.getElementById('kpi-present-count').innerText = STATE.students.length > 0 ? Math.floor(STATE.students.length * 0.85) : 0;
        }

        function openChangePinModal() {
            document.getElementById('new-admin-phone').value = STATE.adminUser.phone;
            document.getElementById('new-admin-pwd').value = STATE.adminUser.password;
            document.getElementById('modal-change-pin').classList.remove('hidden');
        }

        async function saveNewAdminCredentials(e) {
            e.preventDefault();
            const p = document.getElementById('new-admin-phone').value.trim();
            const pwd = document.getElementById('new-admin-pwd').value.trim();
            if (p.length !== 10) {
                alert('Please enter a valid 10-digit mobile number.');
                return;
            }
            STATE.adminUser = { phone: p, password: pwd };
            localStorage.setItem('shiksha_admin_user', JSON.stringify(STATE.adminUser));
            await postToCloud({ action: 'updateAdmin', adminUser: STATE.adminUser });
            alert('Admin credentials updated and synced to Cloud!');
            closeModal('modal-change-pin');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        // ================= SERVICE WORKER REGISTRATION =================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered:', reg.scope))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
